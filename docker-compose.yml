services:
  ncore-addon:
    build: .
    container_name: ncore-addon
    ports:
      - "3005:3000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    labels:
      cosmos-icon: "${COSMOS_ICON_URL}"
    environment:
      - TORBOX_DEBUG=true
      - NCORE_CONFIG_SECRET=${NCORE_CONFIG_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
