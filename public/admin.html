<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nCore Admin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #f1f3f5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #8d949e;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .refresh {
      background: #252a32;
      color: white;
    }

    .refresh:hover {
      background: #303640;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }

    .card {
      background: #181b21;
      border: 1px solid #272c34;
      border-radius: 12px;
      padding: 20px;
    }

    .card-label {
      color: #8d949e;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 30px;
      font-weight: 700;
    }

    .section {
      background: #181b21;
      border: 1px solid #272c34;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .section-header {
      padding: 18px 20px;
      border-bottom: 1px solid #272c34;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 16px;
      text-align: left;
      border-bottom: 1px solid #242932;
      white-space: nowrap;
    }

    th {
      color: #8d949e;
      font-size: 13px;
      font-weight: 600;
    }

    td {
      font-size: 14px;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .active {
      background: #163b29;
      color: #65d391;
    }

    .inactive {
      background: #3a2020;
      color: #ef7777;
    }

    .seed {
      background: #30351b;
      color: #c7d96b;
    }

    .muted {
      color: #777f89;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .btn-toggle {
      background: #252a32;
      color: white;
    }

    .btn-delete {
      background: #452020;
      color: #ff8d8d;
    }

    .btn-history {
      background: #202d3d;
      color: #7fb8ff;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: #777f89;
    }

    #status {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #181b21;
      border: 1px solid #303640;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 20px 12px 40px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    /* ==========================================================
       nCore Admin branding
       ========================================================== */

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      margin-bottom: 30px;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .admin-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 12px;
      flex: 0 0 auto;
    }

    .admin-brand-name {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.025em;
    }

    .admin-brand-name span {
      color: #ef4444;
    }

    .admin-brand-name strong {
      color: #8d949e;
      font-size: 17px;
      font-weight: 600;
      margin-left: 7px;
    }

    .admin-header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .configure-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid #303640;
      background: #181d24;
      color: #c9d3df;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .configure-link:hover {
      background: #232a34;
      border-color: #48515e;
    }

    .section {
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 700px) {
      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-header-actions {
        width: 100%;
      }

      .configure-link,
      .refresh {
        flex: 1;
      }

      .admin-brand-name {
        font-size: 26px;
      }
    }

  </style>
</head>
<body>

<div class="container">

  <header class="admin-header">

    <div class="admin-brand">
      <img
        src="/logo.png"
        alt="nCore logo"
        class="admin-logo"
      >

      <div>
        <div class="admin-brand-name">
          <span>n</span>Core
          <strong>Admin</strong>
        </div>

        <div class="subtitle">
          Manifestek és használati statisztikák
        </div>
      </div>
    </div>

    <div class="admin-header-actions">

      <a
        href="/configure"
        class="configure-link"
      >
        ⚙ Configure
      </a>

      <button class="refresh" onclick="loadAll()">
        ↻ Frissítés
      </button>

    </div>

  </header>

  <div class="stats">
    <div class="card">
      <div class="card-label">Összes manifest</div>
      <div class="card-value" id="stat-manifests">—</div>
    </div>

    <div class="card">
      <div class="card-label">Aktív manifestek</div>
      <div class="card-value" id="stat-active">—</div>
    </div>

    <div class="card">
      <div class="card-label">Seedelés bekapcsolva</div>
      <div class="card-value" id="stat-seed">—</div>
    </div>

    <div class="card">
      <div class="card-label">Keresési előzmények</div>
      <div class="card-value" id="stat-usage">—</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2>Manifestek</h2>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>nCore felhasználó</th>
            <th>Seed</th>
            <th>Létrehozva</th>
            <th>Utoljára használva</th>
            <th>Requestek</th>
            <th>Állapot</th>
            <th>Műveletek</th>
          </tr>
        </thead>

        <tbody id="manifest-table">
          <tr>
            <td colspan="8" class="empty">Betöltés...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section" id="history-section" style="display:none;">
    <div class="section-header">
      <h2 id="history-title">Előzmények</h2>
      <button class="refresh" onclick="closeHistory()">Bezárás</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>IMDb ID</th>
            <th>Cím</th>
            <th>Típus</th>
            <th>Időpont</th>
          </tr>
        </thead>

        <tbody id="history-table"></tbody>
      </table>
    </div>
  </div>

</div>

<div id="status"></div>

<script>
  function showStatus(message) {
    const el = document.getElementById('status');

    el.textContent = message;
    el.style.display = 'block';

    clearTimeout(window.statusTimer);

    window.statusTimer = setTimeout(() => {
      el.style.display = 'none';
    }, 2500);
  }

  function formatDate(value) {
    if (!value) {
      return '<span class="muted">Még nem használta</span>';
    }

    return new Date(value).toLocaleString('hu-HU');
  }

  async function api(url, options = {}) {
    const response = await fetch(url, options);

    if (response.status === 401) {
      throw new Error('Admin hitelesítés szükséges.');
    }

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'API hiba');
    }

    return data;
  }

  async function loadStats() {
    const data = await api('/api/admin/stats');

    document.getElementById('stat-manifests').textContent =
      data.manifests;

    document.getElementById('stat-active').textContent =
      data.activeManifests;

    document.getElementById('stat-seed').textContent =
      data.seedEnabled;

    document.getElementById('stat-usage').textContent =
      data.totalUsage;
  }

  async function loadManifests() {
    const data =
      await api('/api/admin/manifests');

    const tbody =
      document.getElementById('manifest-table');

    if (!data.manifests.length) {
      tbody.innerHTML =
        '<tr><td colspan="8" class="empty">Nincs manifest.</td></tr>';

      return;
    }

    tbody.innerHTML =
      data.manifests.map(manifest => `
        <tr>
          <td>${manifest.id}</td>

          <td>
            <strong>${escapeHtml(manifest.username)}</strong>
          </td>

          <td>
            ${
              manifest.seed_enabled
                ? '<span class="badge seed">SEED</span>'
                : '<span class="muted">Nem</span>'
            }
          </td>

          <td>${formatDate(manifest.created_at)}</td>

          <td>${formatDate(manifest.last_used_at)}</td>

          <td>${manifest.usage_count}</td>

          <td>
            ${
              manifest.active
                ? '<span class="badge active">Aktív</span>'
                : '<span class="badge inactive">Tiltva</span>'
            }
          </td>

          <td>
            <div class="actions">

              <button
                class="btn-history"
                onclick="showHistory(${manifest.id}, '${escapeAttr(manifest.username)}')">
                Előzmények
              </button>

              <button
                class="btn-toggle"
                onclick="toggleManifest(${manifest.id}, ${manifest.active ? 'false' : 'true'})">
                ${manifest.active ? 'Tiltás' : 'Aktiválás'}
              </button>

              <button
                class="btn-delete"
                onclick="deleteManifest(${manifest.id})">
                Törlés
              </button>

            </div>
          </td>
        </tr>
      `).join('');
  }

  async function toggleManifest(id, active) {
    try {
      await api(
        `/api/admin/manifests/${id}/active`,
        {
          method: 'POST',
          headers: {
            'Content-Type':
              'application/x-www-form-urlencoded'
          },
          body:
            `active=${encodeURIComponent(active)}`
        }
      );

      showStatus(
        active === 'true'
          ? 'Manifest aktiválva.'
          : 'Manifest letiltva.'
      );

      await loadAll();

    } catch (error) {
      alert(error.message);
    }
  }

  async function deleteManifest(id) {
    if (!confirm(
      `Biztosan törölni szeretnéd a(z) #${id} manifestet?`
    )) {
      return;
    }

    try {
      await api(
        `/api/admin/manifests/${id}`,
        {
          method: 'DELETE'
        }
      );

      showStatus('Manifest törölve.');

      closeHistory();

      await loadAll();

    } catch (error) {
      alert(error.message);
    }
  }

  async function showHistory(id, username) {
    try {
      const data =
        await api(
          `/api/admin/manifests/${id}/history`
        );

      document.getElementById('history-section').style.display =
        'block';

      document.getElementById('history-title').textContent =
        `Előzmények — ${username}`;

      const tbody =
        document.getElementById('history-table');

      if (!data.history.length) {
        tbody.innerHTML =
          '<tr><td colspan="4" class="empty">Nincs előzmény.</td></tr>';

        return;
      }

      tbody.innerHTML =
        data.history.map(item => `
          <tr>
            <td>${escapeHtml(item.imdb_id)}</td>
            <td>${escapeHtml(item.title)}</td>
            <td>${escapeHtml(item.stream_type)}</td>
            <td>${formatDate(item.created_at)}</td>
          </tr>
        `).join('');

      document.getElementById('history-section')
        .scrollIntoView({
          behavior: 'smooth'
        });

    } catch (error) {
      alert(error.message);
    }
  }

  function closeHistory() {
    document.getElementById('history-section').style.display =
      'none';
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeAttr(value) {
    return String(value ?? '')
      .replaceAll('\\', '\\\\')
      .replaceAll("'", "\\'");
  }

  async function loadAll() {
    try {
      await Promise.all([
        loadStats(),
        loadManifests()
      ]);

      showStatus('Frissítve.');

    } catch (error) {
      console.error(error);
      alert(error.message);
    }
  }

  loadAll();

  setInterval(loadAll, 10000);
</script>

</body>
</html>
